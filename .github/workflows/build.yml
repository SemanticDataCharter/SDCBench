name: build

# Builds the Linux AppImage and the Windows installer. The Windows installer is
# code-signed via SignPath Foundation (free for open source) once the SIGNPATH_*
# repo variables + secret are configured (see docs/CI-SIGNING.md); until then the
# signing step is skipped and the unsigned installer is produced.
#
# Triggers: run manually (workflow_dispatch), on PRs, and on a v* tag (which also
# publishes a GitHub Release with the built artifacts).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: write   # create releases on tags

jobs:
  checks:
    # Runs before either build. The canon tests, and one version everywhere: a tag
    # that does not match VERSION, or is not on main, is refused before anything
    # compiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the SDC4 reference model (public, pinned)
        uses: actions/checkout@v4
        with:
          repository: SemanticDataCharter/SDCRM
          ref: v4.1.0
          path: sdcrm
      - name: Canon tests
        env:
          SDCRM_XSD: ${{ github.workspace }}/sdcrm/sdc4/schemas/sdc4.xsd
        run: |
          pip install -q pytest
          python -m pytest -q tests
      - name: Every version marker agrees with VERSION
        run: python3 tools/set_version.py --check
      - name: Tag matches VERSION and sits on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          [ "$tag" = "$file" ] || { echo "::error::tag v$tag does not match VERSION ($file)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }

  linux:
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install webview build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build AppImage
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: sdcbench-linux
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Windows installer (NSIS)
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis
      # SignPath needs the unsigned installer uploaded as an artifact to sign it.
      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: sdcbench-windows-unsigned
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      # --- Code signing (SignPath Foundation). Skipped until SIGNPATH_* are set. ---
      - name: Sign installer (SignPath)
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      # Final artifact: the signed installer if signing ran, else the unsigned one.
      - name: Stage final installer
        shell: bash
        run: |
          mkdir -p out
          if ls signed/*.exe >/dev/null 2>&1; then
            cp signed/*.exe out/
          else
            cp app/src-tauri/target/release/bundle/nsis/*-setup.exe out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdcbench-windows
          path: out/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "SDCBench ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/sdcbench-linux/*.AppImage \
            artifacts/sdcbench-windows/*.exe
